<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta
    name="description"
    content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}"
  >

  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>

<body>
  <header>
    <div class="header-inner">
      <a href="{{ '/' | relative_url }}">Tanvir Bhupal</a>

      <nav>
        <a href="{{ '/' | relative_url }}#buying">Buying</a>
        <a href="{{ '/' | relative_url }}#coordinating">Coordinating a Move</a>
        <a href="{{ '/' | relative_url }}#selling">Selling</a>
        <a href="{{ '/' | relative_url }}#areas">Areas</a>
        <a href="{{ '/' | relative_url }}#articles">Articles</a>
        <a href="{{ '/' | relative_url }}#about">About</a>
      </nav>

      <a href="{{ '/' | relative_url }}#contact">Talk through your move</a>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>Tanvir Bhupal, Real Estate Advisor</p>
    <p>eXp Realty</p>
    <p>Not intended to solicit clients currently under contract.</p>
  </footer>
</body>
</html>
